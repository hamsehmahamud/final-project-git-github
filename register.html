<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Mekov Tech Solution</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <h1 class="logo">Mekov Tech Solution</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="login.html" class="nav-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="page-section">
            <div class="container auth-container">
                <h2>Create an Account</h2>
                <p>Register to deploy and manage your SaaS architectures.</p>

                <form class="auth-form" action="#" method="POST" id="registerForm">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" name="name" class="form-control"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" name="email" class="form-control"
                            placeholder="Enter your email address" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" class="form-control"
                            placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="cta-button">Register Account</button>

                    <div class="auth-links">
                        <p>Already have an account? <a href="login.html">Sign in here</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Mekov Tech Solution. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
